<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160" role="img" aria-label="toolkit Logo">
  <!-- Rounded Red Icon on the left -->
  <g transform="translate(0, 0)">
    <rect width="160" height="160" rx="40" fill="#d30000"/>
    <path d="M38 30 L80 48 L122 30" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect id="leftStick" x="33" y="25" width="10" height="110" rx="5" fill="#ffffff"/>
    <rect id="middleStick" x="75" y="44" width="10" height="60" rx="5" fill="#ffffff"/>
    <rect id="rightStick" x="117" y="25" width="10" height="60" rx="5" fill="#ffffff"/>
  </g>
  
  <!-- "toolkit" Text Style: Modern Two-Tone Dark for Light Theme -->
  <text x="185" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="105" letter-spacing="-2" xml:space="preserve"><tspan font-weight="400" fill="#666666" y="112">tool</tspan><tspan font-weight="700" fill="#111111" y="112">kit</tspan></text>
