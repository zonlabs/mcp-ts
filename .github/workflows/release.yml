name: Release and Publish

# Publishes package version bumps merged to main.
# Each package publishes to npm, creates a git tag, and creates a GitHub Release.
# Tags are package-specific and follow the pattern <package>-v<version>.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/sdk/package.json'
      - 'packages/tool-router/package.json'
      - 'packages/code-mode/package.json'

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Detect changed package manifests
        id: changed
        shell: bash
        run: |
          BEFORE='${{ github.event.before }}'
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            CHANGED_FILES=$(git ls-tree -r --name-only HEAD)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          fi

          printf '%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -Fxq 'packages/sdk/package.json'; then
            echo 'sdk_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'sdk_changed=false' >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Fxq 'packages/tool-router/package.json'; then
            echo 'tool_router_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tool_router_changed=false' >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Fxq 'packages/code-mode/package.json'; then
            echo 'codemode_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'codemode_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          SDK_NAME=$(node -p "require('./packages/sdk/package.json').name")
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          TOOL_ROUTER_NAME=$(node -p "require('./packages/tool-router/package.json').name")
          TOOL_ROUTER_VERSION=$(node -p "require('./packages/tool-router/package.json').version")
          CODEMODE_NAME=$(node -p "require('./packages/code-mode/package.json').name")
          CODEMODE_VERSION=$(node -p "require('./packages/code-mode/package.json').version")

          echo "sdk_name=$SDK_NAME" >> "$GITHUB_OUTPUT"
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "sdk_tag=sdk-v$SDK_VERSION" >> "$GITHUB_OUTPUT"

          echo "tool_router_name=$TOOL_ROUTER_NAME" >> "$GITHUB_OUTPUT"
          echo "tool_router_version=$TOOL_ROUTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "tool_router_tag=tool-router-v$TOOL_ROUTER_VERSION" >> "$GITHUB_OUTPUT"

          echo "codemode_name=$CODEMODE_NAME" >> "$GITHUB_OUTPUT"
          echo "codemode_version=$CODEMODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "codemode_tag=codemode-v$CODEMODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide publish targets
        id: publish
        shell: bash
        run: |
          git fetch --tags --force

          sdk_should_publish=false
          if [ '${{ steps.changed.outputs.sdk_changed }}' = 'true' ]; then
            if git rev-parse -q --verify "refs/tags/${{ steps.meta.outputs.sdk_tag }}" >/dev/null; then
              sdk_should_publish=false
            else
              sdk_should_publish=true
            fi
          fi
          echo "sdk_should_publish=$sdk_should_publish" >> "$GITHUB_OUTPUT"

          tool_router_should_publish=false
          if [ '${{ steps.changed.outputs.tool_router_changed }}' = 'true' ]; then
            if git rev-parse -q --verify "refs/tags/${{ steps.meta.outputs.tool_router_tag }}" >/dev/null; then
              tool_router_should_publish=false
            else
              tool_router_should_publish=true
            fi
          fi
          echo "tool_router_should_publish=$tool_router_should_publish" >> "$GITHUB_OUTPUT"

          codemode_should_publish=false
          if [ '${{ steps.changed.outputs.codemode_changed }}' = 'true' ]; then
            if git rev-parse -q --verify "refs/tags/${{ steps.meta.outputs.codemode_tag }}" >/dev/null; then
              codemode_should_publish=false
            else
              codemode_should_publish=true
            fi
          fi
          echo "codemode_should_publish=$codemode_should_publish" >> "$GITHUB_OUTPUT"

      - name: Install root dependencies
        if: |
          steps.publish.outputs.sdk_should_publish == 'true' ||
          steps.publish.outputs.tool_router_should_publish == 'true' ||
          steps.publish.outputs.codemode_should_publish == 'true'
        run: npm ci

      - name: Build SDK package
        if: steps.publish.outputs.sdk_should_publish == 'true'
        run: npm run build -w @mcp-ts/sdk

      - name: Publish SDK package to npm
        if: steps.publish.outputs.sdk_should_publish == 'true'
        working-directory: packages/sdk
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create and push SDK git tag
        if: steps.publish.outputs.sdk_should_publish == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "${{ steps.meta.outputs.sdk_tag }}" -m "Release ${{ steps.meta.outputs.sdk_tag }}"
          git push origin "refs/tags/${{ steps.meta.outputs.sdk_tag }}"

      - name: Create SDK GitHub Release
        if: steps.publish.outputs.sdk_should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.sdk_tag }}
          name: ${{ steps.meta.outputs.sdk_tag }}
          generate_release_notes: true
          body: "Release ${{ steps.meta.outputs.sdk_name }} ${{ steps.meta.outputs.sdk_tag }}"

      - name: Build tool-router package
        if: steps.publish.outputs.tool_router_should_publish == 'true'
        working-directory: packages/tool-router
        run: npm run build

      - name: Publish tool-router package to npm
        if: steps.publish.outputs.tool_router_should_publish == 'true'
        working-directory: packages/tool-router
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create and push tool-router git tag
        if: steps.publish.outputs.tool_router_should_publish == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "${{ steps.meta.outputs.tool_router_tag }}" -m "Release ${{ steps.meta.outputs.tool_router_tag }}"
          git push origin "refs/tags/${{ steps.meta.outputs.tool_router_tag }}"

      - name: Create tool-router GitHub Release
        if: steps.publish.outputs.tool_router_should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tool_router_tag }}
          name: ${{ steps.meta.outputs.tool_router_tag }}
          generate_release_notes: true
          body: "Release ${{ steps.meta.outputs.tool_router_name }} ${{ steps.meta.outputs.tool_router_tag }}"

      - name: Build code-mode package
        if: steps.publish.outputs.codemode_should_publish == 'true'
        working-directory: packages/code-mode
        run: npm run build

      - name: Publish code-mode package to npm
        if: steps.publish.outputs.codemode_should_publish == 'true'
        working-directory: packages/code-mode
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create and push code-mode git tag
        if: steps.publish.outputs.codemode_should_publish == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "${{ steps.meta.outputs.codemode_tag }}" -m "Release ${{ steps.meta.outputs.codemode_tag }}"
          git push origin "refs/tags/${{ steps.meta.outputs.codemode_tag }}"

      - name: Create code-mode GitHub Release
        if: steps.publish.outputs.codemode_should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.codemode_tag }}
          name: ${{ steps.meta.outputs.codemode_tag }}
          generate_release_notes: true
          body: "Release ${{ steps.meta.outputs.codemode_name }} ${{ steps.meta.outputs.codemode_tag }}"
